# Architecture rules checked by `cargo xtask arch`. See CONVENTIONS.md (B1–B5, B9, H1, H4, H7).

# Every crate under this directory is a core: it holds one unit of the domain and its
# ports, and depends on no workspace crate but library crates, so on no other core.
[cores]
directory = "crates/cores"

# Each core may depend only on the external crates on its own list, each with a reason:
# <core> = [{ name = "…", reason = "…" }]. Every core has a list, even an empty one.
[cores.allowed-dependencies]
continual-engine = []
continual-registry = []

# Every crate under this directory is a library crate: it holds data that several cores
# mean the same way, declares no port and depends on no workspace crate.
[libraries]
directory = "crates/libraries"

# Each library crate may depend only on the external crates on its own list, each with a
# reason, as a core may. Every library crate has a list, even an empty one.
[libraries.allowed-dependencies]
continual-vocabulary = []

# One composition root per deployable: the only crates that wire adapters.
[composition-roots]
crates = ["continual"]

# Every crate under this directory is an adapter. Adapters depend only on cores and
# library crates, except for declared couplings: { from = "…", to = "…", reason = "…" }.
[adapters]
directory = "crates/adapters"
couplings = []

# Repository tooling; product crates must not depend on it.
[tooling]
crates = ["xtask"]
